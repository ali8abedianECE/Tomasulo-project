  <text x="20.0" y="507.0" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#777777" text-anchor="start">B-type: imm bits are scrambled across [31], [30:25], [11:8], [7] so the sign is always at bit 31 and bits 30:25 align with other formats - hardware can decode faster.</text>
  <text x="20.0" y="523.0" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#777777" text-anchor="start">J-type: same principle - imm[20|10:1|11|19:12] packed into bits [31:12]. Narrow cells above show the bit index only (too small for the field name).</text>

  <text x="20.0" y="327.0" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#777777" text-anchor="start">Imm scrambled: sign=bit31, imm[10:5]=bits30:25, imm[4:1]=bits11:8, imm[11]=bit7. Reassemble: offset = { bit31, bit7, bits30:25, bits11:8, 0 }</text>
